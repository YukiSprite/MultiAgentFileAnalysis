[project]
name = "multi-agent-file-analysis"
version = "0.2.0"
description = "Evidence-grounded multi-agent QA over a controlled virtual knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MultiAgentFileAnalysis contributors" }
]

dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mafa = "multi_agent_file_analysis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
